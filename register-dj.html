<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija DJ-a - BeatSync Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/navbar.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <beat-sync-navbar></beat-sync-navbar>

    <main class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="bg-gray-800 rounded-lg p-8">
            <h1 class="text-3xl font-bold mb-6 text-center">Registracija DJ Profila</h1>
            
            <form class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-2">Avatar</label>
                        <input type="file" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3">
                    </div>
                    
                    <div>
                        <label for="firstName" class="block text-sm font-medium mb-2">Ime</label>
                        <input type="text" id="firstName" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div>
                        <label for="lastName" class="block text-sm font-medium mb-2">Prezime</label>
                        <input type="text" id="lastName" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium mb-2">Email</label>
                        <input type="email" id="email" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div>
                        <label for="phone" class="block text-sm font-medium mb-2">Broj telefona</label>
                        <input type="tel" id="phone" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div>
                        <label for="instagram" class="block text-sm font-medium mb-2">Instagram</label>
                        <input type="url" id="instagram" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3">
                    </div>
                    
                    <div>
                        <label for="facebook" class="block text-sm font-medium mb-2">Facebook</label>
                        <input type="url" id="facebook" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3">
                    </div>
                    
                    <div>
                        <label for="mixtape" class="block text-sm font-medium mb-2">Link na mixtape</label>
                        <input type="url" id="mixtape" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="priceHour" class="block text-sm font-medium mb-2">Cijena po satu (€)</label>
                        <input type="number" id="priceHour" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-2">Opcije rezervacije</label>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2">DJ set
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2">DJ set + Oprema
                            </label>
                            <label class="flex items-center">
                                <input type="checkbox" class="mr-2">Samo oprema
                            </label>
                        </div>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-2">Cijena uključuje (dodatna cijena):</label>
                        <div class="grid md:grid-cols-2 gap-4">
                            <div class="flex items-center justify-between">
                                <span>Zvučnici</span>
                                <input type="number" placeholder="€" class="w-20 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2">
                            </div>
                            <div class="flex items-center justify-between">
                                <span>Rasvjeta</span>
                                <input type="number" placeholder="€" class="w-20 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2">
                            </div>
                            <div class="flex items-center justify-between">
                                <span>Mikser</span>
                                <input type="number" placeholder="€" class="w-20 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2">
                            </div>
                            <div class="flex items-center justify-between">
                                <span>Ostalo</span>
                                <input type="number" placeholder="€" class="w-20 bg-gray-700 border border-gray-600 rounded-lg px-3 py-2">
                            </div>
                        </div>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="description" class="block text-sm font-medium mb-2">Kratki opis</label>
                        <textarea id="description" rows="4" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required></textarea>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="previousJobs" class="block text-sm font-medium mb-2">Prijašnji poslovi</label>
                        <textarea id="previousJobs" rows="3" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3"></textarea>
                    </div>
                    
                    <div>
                        <label for="djSince" class="block text-sm font-medium mb-2">DJ-ujem od</label>
                        <input type="date" id="djSince" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div>
                        <label for="totalYears" class="block text-sm font-medium mb-2">Ukupno godina iskustva</label>
                        <input type="number" id="totalYears" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="password" class="block text-sm font-medium mb-2">Lozinka</label>
                        <input type="password" id="password" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div class="md:col-span-2">
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-medium">
                            Registriraj se
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script>
        feather.replace();
    </script>
</body>
</html>

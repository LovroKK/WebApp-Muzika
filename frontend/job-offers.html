<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ponude Poslova - BeatSync Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/config.js"></script>
    <script src="components/navbar.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <beat-sync-navbar></beat-sync-navbar>

    <main class="container mx-auto px-4 py-8 max-w-5xl">
        <div class="flex justify-between items-center mb-8">
            <h1 id="pageTitle" class="text-4xl font-bold">Ponude Poslova</h1>
            <a id="createBtn" href="create-job-offer.html" class="hidden bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg font-medium flex items-center gap-2">
                <i data-feather="plus" class="w-4 h-4"></i>
                Objavi Ponudu
            </a>
        </div>

        <div id="loginMsg" class="hidden text-center py-16 text-gray-400">
            <p class="text-lg mb-4">Prijavite se za pregled ponuda poslova.</p>
            <a href="auth.html" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg font-medium">Prijava</a>
        </div>

        <!-- Filteri -->
        <div class="bg-gray-800 rounded-lg p-4 mb-6 border border-gray-700 flex flex-wrap gap-3 items-end">
            <div class="flex flex-col gap-1 min-w-[120px]">
                <label class="text-xs text-gray-400">Min iznos (€)</label>
                <input id="filterMinBudzet" type="number" min="0" placeholder="0"
                    class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-purple-500 w-full">
            </div>
            <div class="flex flex-col gap-1 min-w-[120px]">
                <label class="text-xs text-gray-400">Max iznos (€)</label>
                <input id="filterMaxBudzet" type="number" min="0" placeholder="∞"
                    class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-purple-500 w-full">
            </div>
            <div class="flex flex-col gap-1 flex-1 min-w-[160px]">
                <label class="text-xs text-gray-400">Lokacija</label>
                <input id="filterLokacija" type="text" placeholder="Npr. Zagreb, Split..."
                    class="bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-purple-500 w-full">
            </div>
            <button onclick="primijeniFiltre()" class="bg-purple-600 hover:bg-purple-700 px-5 py-2 rounded text-sm font-medium transition">
                Pretraži
            </button>
            <button onclick="resetirajFiltre()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded text-sm font-medium transition">
                Reset
            </button>
        </div>

        <div id="jobOffersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <div id="emptyState" class="hidden text-center py-16">
            <i data-feather="briefcase" class="w-16 h-16 mx-auto mb-4 text-gray-600"></i>
            <h3 id="emptyTitle" class="text-xl font-semibold mb-2">Nema dostupnih ponuda</h3>
            <p id="emptyMsg" class="text-gray-400">Trenutno nema aktivnih ponuda poslova.</p>
        </div>
    </main>

    <script>
        feather.replace();

        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');
        let sveponude = [];

        if (!token) {
            document.getElementById('loginMsg').classList.remove('hidden');
        } else {
            if (role === 'BUSINESS') {
                document.getElementById('createBtn').classList.remove('hidden');
                document.getElementById('pageTitle').textContent = 'Vaše Ponude Poslova';
                document.getElementById('emptyTitle').textContent = 'Niste još objavili ponudu';
                document.getElementById('emptyMsg').textContent = 'Trenutno nemate aktivnih ponuda poslova.';
            }
            ucitajPonude();
        }

        async function ucitajPonude() {
            try {
                const res = await fetch(`${API_BASE_URL}/job-offers`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) throw new Error();

                sveponude = await res.json();
                prikaziPonude(sveponude);
            } catch {
                document.getElementById('jobOffersContainer').innerHTML =
                    '<p class="col-span-3 text-center text-red-400">Greška pri učitavanju ponuda.</p>';
            }
        }

        function prikaziPonude(ponude) {
            const container = document.getElementById('jobOffersContainer');
            const emptyState = document.getElementById('emptyState');
            if (ponude.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                container.innerHTML = ponude.map(p => renderKartica(p)).join('');
                feather.replace();
            }
        }

        function primijeniFiltre() {
            const minBudzet = parseFloat(document.getElementById('filterMinBudzet').value) || 0;
            const maxBudzet = parseFloat(document.getElementById('filterMaxBudzet').value) || Infinity;
            const lokacija = document.getElementById('filterLokacija').value.trim().toLowerCase();

            const filtrirane = sveponude.filter(p => {
                const budzet = p.budzet != null ? parseFloat(p.budzet) : null;

                if (budzet !== null) {
                    if (budzet < minBudzet || budzet > maxBudzet) return false;
                }

                if (lokacija) {
                    const lokacijaPonude = (p.lokacija || '').toLowerCase();
                    // Provjeri sadrži li lokacija ponude barem jednu od upisanih riječi
                    const rijeci = lokacija.split(/\s+/).filter(Boolean);
                    const pronasao = rijeci.some(r => lokacijaPonude.includes(r));
                    if (!pronasao) return false;
                }

                return true;
            });

            prikaziPonude(filtrirane);
        }

        function resetirajFiltre() {
            document.getElementById('filterMinBudzet').value = '';
            document.getElementById('filterMaxBudzet').value = '';
            document.getElementById('filterLokacija').value = '';
            prikaziPonude(sveponude);
        }

        function renderKartica(p) {
            const datum = p.datum ? new Date(p.datum).toLocaleDateString('hr-HR') : '—';
            const pocetak = p.pocetak ? p.pocetak.substring(0, 5) : '—';
            const kraj = p.kraj ? p.kraj.substring(0, 5) : '—';
            const budzet = p.budzet ? p.budzet + ' €' : 'Po dogovoru';


            let akcija = '';
            if (role === 'IZVODAC') {
                if (p.jeliPrijavljen) {
                    akcija = `<button disabled class="bg-gray-600 px-4 py-2 rounded text-sm cursor-not-allowed opacity-60">Prijavljeni ✓</button>`;
                } else {
                    akcija = `<button onclick="prijaviSe(${p.idPonude}, this)" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded text-sm transition">Prijavi se</button>`;
                }
            } else if (role === 'BUSINESS') {
                const bpBadge = p.brojPrijava > 0
                    ? `<span class="bg-yellow-700/60 text-yellow-300 text-xs px-2 py-1 rounded ml-2">Prijave: ${p.brojPrijava}</span>`
                    : '';
                akcija = `<span class="text-xs text-gray-400 flex items-center gap-1">Vaša ponuda${bpBadge}</span>`;
            }

            return `
                <div class="bg-gray-800 rounded-lg p-6 border border-gray-700 hover:shadow-lg hover:border-purple-700 transition-all flex flex-col gap-3 cursor-pointer"
                     onclick="otvoriModal(${p.idPonude})">
                    <div class="flex justify-between items-start">
                        <h3 class="text-lg font-semibold leading-tight">${p.nazivPonude}</h3>
                        <span class="bg-green-700/60 text-green-300 text-xs px-2 py-1 rounded whitespace-nowrap ml-2">Aktivna</span>
                    </div>
                    <p class="text-purple-400 text-sm font-medium">${p.nazivKluba} <span class="text-gray-500">(@${p.businessUsername})</span></p>
                    <div class="space-y-1 text-sm text-gray-300">
                        <div class="flex items-center gap-2"><i data-feather="calendar" class="w-4 h-4 text-purple-400 flex-shrink-0"></i>${datum}</div>
                        <div class="flex items-center gap-2"><i data-feather="clock" class="w-4 h-4 text-purple-400 flex-shrink-0"></i>${pocetak} – ${kraj}</div>
                        <div class="flex items-center gap-2"><i data-feather="map-pin" class="w-4 h-4 text-purple-400 flex-shrink-0"></i>${p.lokacija || '—'}</div>
                    </div>
                    ${p.potrebnoIskustvo ? `<p class="text-xs text-gray-400">Iskustvo: ${p.potrebnoIskustvo}</p>` : ''}
                    ${p.opisPosla ? `<p class="text-sm text-gray-300 line-clamp-2">${p.opisPosla}</p>` : ''}
                    <div class="flex justify-between items-center mt-auto pt-2 border-t border-gray-700">
                        <span class="text-purple-400 font-semibold">${budzet}</span>
                        <span onclick="event.stopPropagation()">${akcija}</span>
                    </div>
                </div>`;
        }

        let _pendingPrijavaId = null;
        let _pendingPrijavaBtn = null;
        let _pendingPrijavaIsModal = false;

        function prijaviSe(id, btn) {
            _pendingPrijavaId = id;
            _pendingPrijavaBtn = btn;
            _pendingPrijavaIsModal = false;
            document.getElementById('confirmPrijavaModal').classList.remove('hidden');
        }

        async function _izvrsiPrijavu() {
            document.getElementById('confirmPrijavaModal').classList.add('hidden');
            const id = _pendingPrijavaId;
            const btn = _pendingPrijavaBtn;
            const isModal = _pendingPrijavaIsModal;
            btn.disabled = true;
            btn.textContent = 'Prijava...';
            try {
                const res = await fetch(`${API_BASE_URL}/job-offers/${id}/prijava`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Greška');
                if (isModal) {
                    btn.textContent = 'Prijavljeni ✓';
                    btn.className = 'bg-gray-600 px-6 py-2 rounded text-sm cursor-not-allowed opacity-60';
                } else {
                    btn.textContent = 'Prijavljeni ✓';
                    btn.className = 'bg-gray-600 px-4 py-2 rounded text-sm cursor-not-allowed opacity-60';
                }
                btn.disabled = true;
                const p = sveponude.find(x => x.idPonude === id);
                if (p) p.jeliPrijavljen = true;
                prikaziPonude(sveponude);
            } catch (err) {
                btn.textContent = err.message;
                btn.disabled = false;
            }
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') document.getElementById('jobDetailModal').classList.add('hidden');
        });

        function otvoriModal(idPonude) {
            const p = sveponude.find(x => x.idPonude === idPonude);
            if (!p) return;
            const datum = p.datum ? new Date(p.datum).toLocaleDateString('hr-HR') : '—';
            const poc = p.pocetak ? String(p.pocetak).substring(0, 5) : '—';
            const kraj = p.kraj ? String(p.kraj).substring(0, 5) : '—';
            document.getElementById('modalNaziv').textContent = p.nazivPonude;
            document.getElementById('modalKlub').textContent = p.nazivKluba + ' (@' + p.businessUsername + ')';
            document.getElementById('modalDatum').textContent = datum;
            document.getElementById('modalVrijeme').textContent = poc + ' – ' + kraj;
            document.getElementById('modalLokacija').textContent = p.lokacija || '—';
            document.getElementById('modalBudzet').textContent = p.budzet ? p.budzet + ' €' : 'Po dogovoru';
            document.getElementById('modalOpis').textContent = p.opisPosla || '—';
            const iskWrap = document.getElementById('modalIskustvoWrap');
            if (p.potrebnoIskustvo) {
                iskWrap.classList.remove('hidden');
                document.getElementById('modalIskustvo').textContent = p.potrebnoIskustvo;
            } else {
                iskWrap.classList.add('hidden');
            }
            const akcijaWrap = document.getElementById('modalAkcijaWrap');
            akcijaWrap.innerHTML = '';
            if (role === 'IZVODAC') {
                if (p.jeliPrijavljen) {
                    akcijaWrap.innerHTML = `<button disabled class="bg-gray-600 px-6 py-2 rounded text-sm opacity-60 cursor-not-allowed">Prijavljeni ✓</button>`;
                } else {
                    akcijaWrap.innerHTML = `<button onclick="prijaviSeModal(${p.idPonude}, this)" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded text-sm transition">Prijavi se</button>`;
                }
            }
            document.getElementById('jobDetailModal').classList.remove('hidden');
            feather.replace();
        }

        function zatvoriModal() {
            document.getElementById('jobDetailModal').classList.add('hidden');
        }

        function prijaviSeModal(id, btn) {
            _pendingPrijavaId = id;
            _pendingPrijavaBtn = btn;
            _pendingPrijavaIsModal = true;
            document.getElementById('confirmPrijavaModal').classList.remove('hidden');
        }
    </script>

    <!-- Potvrda prijave -->
    <div id="confirmPrijavaModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[60] hidden">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 w-full max-w-sm mx-4 text-center shadow-2xl">
            <p class="text-gray-100 font-medium mb-1">Prijava na posao</p>
            <p class="text-gray-400 text-sm mb-6">Želite li se prijaviti na ovaj posao?</p>
            <div class="flex gap-3 justify-center">
                <button onclick="_izvrsiPrijavu()" class="bg-purple-600 hover:bg-purple-700 px-6 py-2 rounded-lg text-sm font-semibold transition-colors">
                    Da, prijavi me
                </button>
                <button onclick="document.getElementById('confirmPrijavaModal').classList.add('hidden')" class="bg-gray-600 hover:bg-gray-500 px-6 py-2 rounded-lg text-sm font-semibold transition-colors">
                    Odustani
                </button>
            </div>
        </div>
    </div>

    <!-- Job Offer Detail Modal -->
    <div id="jobDetailModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50 hidden"
         onclick="zatvoriModal()">
        <div class="bg-gray-800 rounded-lg p-8 w-full max-w-xl max-h-[90vh] overflow-y-auto mx-4"
             onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-4">
                <h2 id="modalNaziv" class="text-2xl font-bold pr-4"></h2>
                <button onclick="zatvoriModal()" class="text-gray-400 hover:text-white text-3xl leading-none flex-shrink-0">&times;</button>
            </div>
            <p id="modalKlub" class="text-purple-400 font-medium mb-4"></p>
            <div class="space-y-2 text-sm text-gray-300 mb-4">
                <div class="flex gap-2"><i data-feather="calendar" class="w-4 h-4 text-purple-400 flex-shrink-0 mt-0.5"></i><span id="modalDatum"></span></div>
                <div class="flex gap-2"><i data-feather="clock" class="w-4 h-4 text-purple-400 flex-shrink-0 mt-0.5"></i><span id="modalVrijeme"></span></div>
                <div class="flex gap-2"><i data-feather="map-pin" class="w-4 h-4 text-purple-400 flex-shrink-0 mt-0.5"></i><span id="modalLokacija"></span></div>
                <div class="flex gap-2"><i data-feather="dollar-sign" class="w-4 h-4 text-purple-400 flex-shrink-0 mt-0.5"></i><span id="modalBudzet"></span></div>
            </div>
            <div class="mb-4">
                <h3 class="font-semibold mb-2">Opis posla</h3>
                <p id="modalOpis" class="text-sm text-gray-300 whitespace-pre-wrap leading-relaxed"></p>
            </div>
            <div id="modalIskustvoWrap" class="mb-4 hidden">
                <h3 class="font-semibold mb-2">Potrebno iskustvo</h3>
                <p id="modalIskustvo" class="text-sm text-gray-300"></p>
            </div>
            <div id="modalAkcijaWrap" class="mt-6 flex justify-end"></div>
        </div>
    </div>
</body>
</html>

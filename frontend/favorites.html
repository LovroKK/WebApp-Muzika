<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moji Favoriti - BeatSync Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/navbar.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <beat-sync-navbar></beat-sync-navbar>

    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-gray-800 rounded-lg p-8">
            <h1 class="text-3xl font-bold mb-8 text-center">Moji Favoriti</h1>

            <!-- Tabovi -->
            <div class="flex border-b border-gray-700 mb-8">
                <button id="tabDj" onclick="prikaziTab('IZVODAC')"
                    class="px-6 py-3 font-medium text-purple-400 border-b-2 border-purple-500">
                    DJ-evi
                </button>
                <button id="tabKlub" onclick="prikaziTab('BUSINESS')"
                    class="px-6 py-3 font-medium text-gray-400 hover:text-gray-200">
                    Klubovi
                </button>
            </div>

            <div id="favGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="col-span-3 text-center text-gray-400">Učitavanje...</p>
            </div>
        </div>
    </main>

    <script>
        feather.replace();

        const token = localStorage.getItem('token');
        let sviFavoriti = [];
        let aktivniTab = 'IZVODAC';

        async function ucitajFavorite() {
            if (!token) {
                document.getElementById('favGrid').innerHTML =
                    '<p class="col-span-3 text-center text-gray-400">Morate biti prijavljeni za prikaz favorita.</p>';
                return;
            }

            try {
                const res = await fetch('http://localhost:8080/api/favoriti', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                sviFavoriti = await res.json();
                prikaziTab(aktivniTab);
            } catch {
                document.getElementById('favGrid').innerHTML =
                    '<p class="col-span-3 text-center text-red-400">Greška pri učitavanju favorita.</p>';
            }
        }

        async function ukloniFavorit(tipFavorita, favoritUsername, card) {
            try {
                await fetch(`http://localhost:8080/api/favoriti/toggle?tipFavorita=${tipFavorita}&favoritUsername=${favoritUsername}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                sviFavoriti = sviFavoriti.filter(f => !(f.tipFavorita === tipFavorita && f.favoritUsername === favoritUsername));
                card.remove();
                if (document.getElementById('favGrid').children.length === 0) {
                    prikaziTab(aktivniTab);
                }
            } catch {}
        }

        async function prikaziTab(tip) {
            aktivniTab = tip;

            document.getElementById('tabDj').className = tip === 'IZVODAC'
                ? 'px-6 py-3 font-medium text-purple-400 border-b-2 border-purple-500'
                : 'px-6 py-3 font-medium text-gray-400 hover:text-gray-200';
            document.getElementById('tabKlub').className = tip === 'BUSINESS'
                ? 'px-6 py-3 font-medium text-purple-400 border-b-2 border-purple-500'
                : 'px-6 py-3 font-medium text-gray-400 hover:text-gray-200';

            const filtered = sviFavoriti.filter(f => f.tipFavorita === tip);
            const grid = document.getElementById('favGrid');

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-3 text-center text-gray-400">Nemate ${tip === 'IZVODAC' ? 'omiljenih DJ-eva' : 'omiljenih klubova'}.</p>`;
                return;
            }

            const cards = await Promise.all(filtered.map(async f => {
                try {
                    const endpoint = f.tipFavorita === 'IZVODAC'
                        ? `http://localhost:8080/api/djs?search=${encodeURIComponent(f.favoritUsername)}`
                        : `http://localhost:8080/api/business/javni/${encodeURIComponent(f.favoritUsername)}`;

                    if (f.tipFavorita === 'IZVODAC') {
                        const res = await fetch(endpoint);
                        const djs = await res.json();
                        const dj = djs.find(d => d.usernameIzvodac === f.favoritUsername);
                        if (!dj) return '';
                        const avatar = dj.logoAvatar ||
                            'https://ui-avatars.com/api/?name=' + encodeURIComponent((dj.ime || '') + '+' + (dj.prezime || '')) + '&background=7c3aed&color=fff&size=128';
                        const cijena = dj.cijenaPoSatu ? dj.cijenaPoSatu + '€/sat' : 'Po dogovoru';
                        return `
                            <div id="card-${f.favoritUsername}" class="bg-gray-700 rounded-lg p-5 border border-purple-500">
                                <div class="flex items-center justify-between mb-3">
                                    <div class="flex items-center">
                                        <img src="${avatar}" class="w-14 h-14 rounded-full mr-3 object-cover">
                                        <div>
                                            <p class="font-semibold">${dj.ime} ${dj.prezime}</p>
                                            <p class="text-gray-400 text-sm">@${dj.usernameIzvodac}</p>
                                        </div>
                                    </div>
                                    <button onclick="ukloniFavorit('IZVODAC','${f.favoritUsername}', document.getElementById('card-${f.favoritUsername}'))" title="Ukloni iz favorita" class="text-xl">❤️</button>
                                </div>
                                <p class="text-gray-300 text-sm mb-3 line-clamp-2">${dj.kratkiOpis || ''}</p>
                                <span class="text-purple-400 font-medium text-sm">${cijena}</span>
                            </div>`;
                    }
                    return '';
                } catch { return ''; }
            }));

            grid.innerHTML = cards.filter(c => c).join('') ||
                `<p class="col-span-3 text-center text-gray-400">Nemate ${tip === 'IZVODAC' ? 'omiljenih DJ-eva' : 'omiljenih klubova'}.</p>`;
        }

        ucitajFavorite();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - BeatSync Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/navbar.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <beat-sync-navbar></beat-sync-navbar>

    <main class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-gray-800 rounded-lg p-8">
            <h1 class="text-3xl font-bold mb-6 text-center">Prijava</h1>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium mb-2">Korisničko ime</label>
                    <input type="text" id="username" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500" required>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium mb-2">Lozinka</label>
                    <input type="password" id="password" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500" required>
                </div>

                <p id="errorMsg" class="hidden text-red-400 text-sm text-center"></p>

                <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-medium">
                    Prijavi se
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-400">Nemaš račun?</p>
                <div class="mt-4 space-y-3">
                    <a href="register-dj.html" class="block w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-lg font-medium text-center">
                        Registriraj se kao DJ
                    </a>
                    <a href="register-business.html" class="block w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-lg font-medium text-center">
                        Registriraj se kao Klub
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        feather.replace();

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Prijava...';

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                
                let data = {};
                const text = await response.text();
                if (text) {
                    try {
                        data = JSON.parse(text);
                    } catch {
                        // nije JSON, ignoriraj
                    }   
                }

                if (!response.ok) {
                    const poruka = data.detail
                        || data.message
                        || (response.status === 403 ? 'Pogrešno korisničko ime ili lozinka'
                            : 'Greška pri prijavi');
                    throw new Error(poruka);
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('role', data.role);
                localStorage.setItem('user_logged_in', 'true');

                window.location.href = 'index.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Prijavi se';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava - BeatSync Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/navbar.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <beat-sync-navbar></beat-sync-navbar>

    <main class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-gray-800 rounded-lg p-8">
            <h1 class="text-3xl font-bold mb-6 text-center">Prijava</h1>
            
            <form class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium mb-2">Email</label>
                    <input type="email" id="email" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500" required>
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium mb-2">Lozinka</label>
                    <input type="password" id="password" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500" required>
                </div>
                
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-medium">
                        Prijavi se
                    </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-gray-400">Nemaš račun?</p>
                <div class="mt-4 space-y-3">
                    <a href="register-dj.html" class="block w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-lg font-medium text-center">
                        Registriraj se kao DJ
                    </a>
                    <a href="register-business.html" class="block w-full bg-gray-700 hover:bg-gray-600 py-3 rounded-lg font-medium text-center">
                        Registriraj se kao Klub
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        feather.replace();
    </script>
</body>
</html>

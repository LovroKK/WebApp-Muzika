<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Rezervacije - BeatSync Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/navbar.js"></script>
    <script src="components/star-rating.js"></script>
    <script src="components/review-form.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <beat-sync-navbar></beat-sync-navbar>

    <main class="container mx-auto px-4 py-8 max-w-5xl">
        <div class="flex items-center gap-4 mb-8">
            <a href="javascript:history.back()" class="text-purple-400 hover:text-purple-300 flex items-center gap-1 text-sm">
                <i data-feather="arrow-left" class="w-4 h-4"></i> Nazad
            </a>
            <h1 class="text-4xl font-bold">Moje Rezervacije</h1>
        </div>

        <div id="loginMsg" class="hidden text-center py-16 text-gray-400">
            <p class="text-lg mb-4">Prijavite se za pregled rezervacija.</p>
            <a href="auth.html" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg font-medium">Prijava</a>
        </div>

        <div id="lista" class="space-y-4"></div>

        <div id="emptyState" class="hidden text-center py-16">
            <i data-feather="calendar" class="w-16 h-16 mx-auto mb-4 text-gray-600"></i>
            <h3 class="text-xl font-semibold mb-2">Nema rezervacija</h3>
            <p class="text-gray-400">Trenutno nema aktivnih rezervacija.</p>
        </div>
    </main>

    <script>
        feather.replace();

        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        const statusLabels = {
            REQUESTED:   { label: 'Na čekanju',  cls: 'bg-yellow-700/60 text-yellow-300' },
            ACCEPTED:    { label: 'Prihvaćeno',  cls: 'bg-green-700/60 text-green-300' },
            IN_PROGRESS: { label: 'U tijeku',    cls: 'bg-blue-700/60 text-blue-300' },
            COMPLETED:   { label: 'Završeno',    cls: 'bg-gray-600/60 text-gray-300' },
            CANCELLED:   { label: 'Otkazano',    cls: 'bg-red-700/60 text-red-300' }
        };

        if (!token) {
            document.getElementById('loginMsg').classList.remove('hidden');
        } else {
            ucitaj();
        }

        window._rezervacijeCache = [];

        async function ucitaj() {
            try {
                const res = await fetch('http://localhost:8080/api/rezervacije', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error();
                const lista = await res.json();
                window._rezervacijeCache = lista;

                if (lista.length === 0) {
                    document.getElementById('lista').innerHTML = '';
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }

                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('lista').innerHTML = lista.map(r => renderKartica(r)).join('');
                feather.replace();
            } catch {
                document.getElementById('lista').innerHTML =
                    '<p class="text-center text-red-400">Greška pri učitavanju rezervacija.</p>';
            }
        }

        function renderKartica(r) {
            const status = statusLabels[r.statusRezervacije] || { label: r.statusRezervacije, cls: 'bg-gray-600 text-gray-300' };
            const datum = r.datumPonude ? new Date(r.datumPonude).toLocaleDateString('hr-HR') : '—';
            const od = r.periodOd ? r.periodOd.substring(11, 16) : '—';
            const do_ = r.periodDo ? r.periodDo.substring(11, 16) : '—';
            const budzet = r.budzet ? r.budzet + ' €' : '—';

            // Potvrda indikatori
            let potvrdaInfo = '';
            if (r.statusRezervacije === 'REQUESTED') {
                const ikBusiness = r.potvrdaBusiness
                    ? '<span class="text-green-400" title="Klub potvrdio">✓ Klub</span>'
                    : '<span class="text-gray-500" title="Klub nije potvrdio">○ Klub</span>';
                const ikIzvodac = r.potvrdaIzvodac
                    ? '<span class="text-green-400" title="Izvođač potvrdio">✓ Izvođač</span>'
                    : '<span class="text-gray-500" title="Izvođač nije potvrdio">○ Izvođač</span>';
                potvrdaInfo = `<div class="flex gap-3 text-xs mt-1">${ikBusiness} ${ikIzvodac}</div>`;
            }

            let akcije = '';
            if (role === 'BUSINESS') {
                if (r.statusRezervacije === 'REQUESTED') {
                    akcije = `
                        <button onclick="otvoreChatNavbar(${r.idRezervacije})" class="bg-purple-700 hover:bg-purple-800 px-4 py-2 rounded text-sm flex items-center gap-1">
                            <i data-feather="message-circle" class="w-3 h-3"></i> Otvori chat
                        </button>`;
                } else if (r.statusRezervacije === 'IN_PROGRESS') {
                    akcije = `
                        <button onclick="zavrsiRezervaciju(${r.idRezervacije}, this)" class="bg-gray-500 hover:bg-gray-600 px-4 py-2 rounded text-sm">Označi završenim</button>`;
                } else if (r.statusRezervacije === 'COMPLETED') {
                    if (r.paymentStatus !== 'PAID') {
                        akcije = `<button onclick="plati(${r.idRezervacije}, this)" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-sm flex items-center gap-1">
                            <i data-feather="credit-card" class="w-3 h-3"></i> Plati izvođača
                        </button>`;
                    } else if (r.hasReview) {
                        akcije = `<span class="text-xs px-3 py-2 rounded bg-purple-900/40 text-purple-300 flex items-center gap-1">
                            <i data-feather="check-circle" class="w-3 h-3"></i> Recenzija ostavljena
                        </span>`;
                    } else {
                        akcije = `<button onclick="otvoriRecenziju(${r.idRezervacije})" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-2 rounded text-sm flex items-center gap-1">
                            <i data-feather="star" class="w-3 h-3"></i> Ostavi recenziju
                        </button>`;
                    }
                }
            } else {
                // IZVODAC
                if (r.statusRezervacije === 'REQUESTED') {
                    akcije = `
                        <button onclick="povuciPrijavu(${r.idRezervacije}, this)" class="bg-red-700 hover:bg-red-800 px-4 py-2 rounded text-sm">Povuci prijavu</button>`;
                }
            }

            return `
                <div id="rez-${r.idRezervacije}" class="bg-gray-800 rounded-lg p-6 border border-gray-700">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="space-y-1">
                            <div class="flex items-center gap-3 flex-wrap">
                                <h3 class="text-lg font-semibold">${r.nazivPonude || '—'}</h3>
                                <span class="text-xs px-2 py-1 rounded ${status.cls}">${status.label}</span>
                                ${renderPaymentBadge(r)}
                            </div>
                            <p class="text-sm text-gray-400">
                                ${role === 'BUSINESS'
                                    ? `Izvođač: <span class="text-gray-200">${r.izvodacIme} ${r.izvodacPrezime} (@${r.izvodacUsername})</span>`
                                    : `Klub: <span class="text-gray-200">${r.nazivKluba} (@${r.businessUsername})</span>`}
                            </p>
                            <div class="flex gap-4 text-sm text-gray-400 mt-1">
                                <span><i data-feather="calendar" class="w-3 h-3 inline mr-1"></i>${datum}</span>
                                <span><i data-feather="clock" class="w-3 h-3 inline mr-1"></i>${od} – ${do_}</span>
                                <span class="text-purple-400 font-medium">${budzet}</span>
                            </div>
                            ${potvrdaInfo}
                        </div>
                        ${akcije ? `<div class="flex gap-2 flex-shrink-0">${akcije}</div>` : ''}
                    </div>
                </div>`;
        }

        function otvoreChatNavbar(rezId) {
            const navbar = document.querySelector('beat-sync-navbar');
            if (navbar) {
                navbar._openPanel();
                // Otvori direktno tu konverzaciju nakon kratke pauze da se panel otvori
                setTimeout(() => navbar._openConversation(rezId, {}), 100);
            }
        }

        async function zavrsiRezervaciju(id, btn) {
            btn.disabled = true;
            try {
                const res = await fetch(`http://localhost:8080/api/rezervacije/${id}/zavrsi`, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error();
                ucitaj();
            } catch {
                btn.disabled = false;
                btn.textContent = 'Greška';
            }
        }

        async function povuciPrijavu(id, btn) {
            btn.disabled = true;
            try {
                const res = await fetch(`http://localhost:8080/api/rezervacije/${id}/otkazi`, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error();
                ucitaj();
            } catch {
                btn.disabled = false;
                btn.textContent = 'Greška';
            }
        }

        function otvoriRecenziju(idRezervacije) {
            const rez = (window._rezervacijeCache || []).find(r => r.idRezervacije === idRezervacije);
            if (!rez) return;
            window.openReviewForm(rez, {
                onSubmitted: function () { ucitaj(); }
            });
        }

        function renderPaymentBadge(r) {
            if (r.statusRezervacije !== 'COMPLETED' || !r.paymentStatus) return '';
            const labels = {
                PAID: { txt: 'Plaćeno', cls: 'bg-green-700/60 text-green-300' },
                PENDING: { txt: 'Plaćanje u tijeku', cls: 'bg-yellow-700/60 text-yellow-300' },
                FAILED: { txt: 'Plaćanje neuspješno', cls: 'bg-red-700/60 text-red-300' },
                EXPIRED: { txt: 'Plaćanje isteklo', cls: 'bg-gray-700/60 text-gray-300' },
                REFUNDED: { txt: 'Vraćeno', cls: 'bg-orange-700/60 text-orange-300' }
            };
            const l = labels[r.paymentStatus];
            if (!l) return '';
            return `<span class="text-xs px-2 py-1 rounded ${l.cls}">${l.txt}</span>`;
        }

        async function plati(id, btn) {
            btn.disabled = true;
            btn.textContent = 'Pripremam plaćanje...';
            try {
                const res = await fetch('http://localhost:8080/api/placanja/checkout-session', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ idRezervacije: id })
                });
                if (!res.ok) {
                    let msg = 'Greška pri pokretanju plaćanja.';
                    try {
                        const data = await res.json();
                        if (data && (data.message || data.error)) msg = data.message || data.error;
                    } catch (_) {}
                    throw new Error(msg);
                }
                const data = await res.json();
                window.location.href = data.checkoutUrl;
            } catch (e) {
                btn.disabled = false;
                btn.textContent = 'Plati izvođača';
                alert(e.message || 'Greška pri pokretanju plaćanja.');
            }
        }
    </script>
</body>
</html>

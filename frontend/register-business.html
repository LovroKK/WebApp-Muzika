<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija Kluba - BeatSync Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/navbar.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <beat-sync-navbar></beat-sync-navbar>

    <main class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="bg-gray-800 rounded-lg p-8">
            <h1 class="text-3xl font-bold mb-6 text-center">Registracija Kluba</h1>
            
            <form class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-2">Logo/Avatar</label>
                        <input type="file" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="businessName" class="block text-sm font-medium mb-2">Naziv kluba</label>
                        <input type="text" id="businessName" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="location" class="block text-sm font-medium mb-2">Lokacija</label>
                        <input type="text" id="location" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="description" class="block text-sm font-medium mb-2">Opis</label>
                        <textarea id="description" rows="4" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required></textarea>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-2">Slike prostora</label>
                        <input type="file" multiple class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="residentDJ" class="block text-sm font-medium mb-2">Resident DJ</label>
                        <input type="text" id="residentDJ" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-2">Tko je ovdje radio (5 najboljih):</label>
                        <textarea placeholder="Navedite 5 najboljih DJ-eva koji su nastupali u vašem klubu" rows="3" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3"></textarea>
                    </div>
                    
                    <div>
                        <label for="businessEmail" class="block text-sm font-medium mb-2">Email</label>
                        <input type="email" id="businessEmail" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div>
                        <label for="businessPhone" class="block text-sm font-medium mb-2">Broj telefona</label>
                        <input type="tel" id="businessPhone" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="businessPassword" class="block text-sm font-medium mb-2">Lozinka</label>
                        <input type="password" id="businessPassword" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>
                    
                    <div class="md:col-span-2">
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-medium">
                            Registriraj se
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script>
        feather.replace();
    </script>
</body>
</html>

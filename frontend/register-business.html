<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija Kluba - BeatSync Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/config.js"></script>
    <script src="components/navbar.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <beat-sync-navbar></beat-sync-navbar>

    <main class="container mx-auto px-4 py-8 max-w-2xl">
        <div class="bg-gray-800 rounded-lg p-8">
            <h1 class="text-3xl font-bold mb-6 text-center">Registracija Kluba</h1>

            <form id="registerBusinessForm" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label for="usernameBusiness" class="block text-sm font-medium mb-2">Korisničko ime</label>
                        <input type="text" id="usernameBusiness" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-2">Logo/Avatar</label>
                        <input type="file" id="logoFile" accept="image/*" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3">
                    </div>

                    <div class="md:col-span-2">
                        <label for="nazivKluba" class="block text-sm font-medium mb-2">Naziv kluba</label>
                        <input type="text" id="nazivKluba" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>

                    <div class="md:col-span-2">
                        <label for="lokacija" class="block text-sm font-medium mb-2">Lokacija</label>
                        <input type="text" id="lokacija" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>

                    <div class="md:col-span-2">
                        <label for="opis" class="block text-sm font-medium mb-2">Opis</label>
                        <textarea id="opis" rows="4" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required></textarea>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-2">Slike prostora</label>
                        <input type="file" id="slikeFiles" accept="image/*" multiple class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3">
                    </div>

                    <div class="md:col-span-2">
                        <label for="residentDJ" class="block text-sm font-medium mb-2">Resident DJ</label>
                        <input type="text" id="residentDJ" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-2">Tko je ovdje radio (5 najboljih):</label>
                        <textarea id="najboljiIzvodaci" placeholder="Navedite 5 najboljih DJ-eva koji su nastupali u vašem klubu" rows="3" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3"></textarea>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium mb-2">Email</label>
                        <input type="email" id="email" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>

                    <div>
                        <label for="brojTelefona" class="block text-sm font-medium mb-2">Broj telefona</label>
                        <input type="tel" id="brojTelefona" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>

                    <div class="md:col-span-2">
                        <label for="lozinka" class="block text-sm font-medium mb-2">Lozinka</label>
                        <input type="password" id="lozinka" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3" required>
                    </div>

                    <div class="md:col-span-2">
                        <p id="errorMsg" class="hidden text-red-400 text-sm text-center mb-2"></p>
                        <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded-lg font-medium">
                            Registriraj se
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script>
        feather.replace();

        document.getElementById('registerBusinessForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');

            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registracija...';

            const payload = {
                usernameBusiness: document.getElementById('usernameBusiness').value.trim(),
                nazivKluba: document.getElementById('nazivKluba').value.trim(),
                email: document.getElementById('email').value.trim(),
                lozinka: document.getElementById('lozinka').value,
                lokacija: document.getElementById('lokacija').value.trim() || null,
                opis: document.getElementById('opis').value.trim() || null,
                brojTelefona: document.getElementById('brojTelefona').value.trim() || null,
                residentDjUsername: document.getElementById('residentDJ').value.trim() || null,
                najboljiIzvodaci: document.getElementById('najboljiIzvodaci').value.trim() || null
            };

            try {
                const response = await fetch(`${API_BASE_URL}/auth/register/business`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Greška pri registraciji');
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('role', data.role);
                localStorage.setItem('user_logged_in', 'true');

                const token = data.token;

                // Upload logo
                const logoFile = document.getElementById('logoFile').files[0];
                if (logoFile) {
                    const formData = new FormData();
                    formData.append('file', logoFile);
                    try {
                        const uploadRes = await fetch(`${API_BASE_URL}/business/avatar`, {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + token },
                            body: formData
                        });
                        if (!uploadRes.ok) {
                            console.error('Logo upload failed:', uploadRes.status);
                        }
                    } catch (e) {
                        console.error('Logo upload error:', e);
                    }
                }

                // Upload slike prostora
                const slikeFiles = document.getElementById('slikeFiles').files;
                for (const file of slikeFiles) {
                    const formData = new FormData();
                    formData.append('file', file);
                    try {
                        const uploadRes = await fetch(`${API_BASE_URL}/business/slike`, {
                            method: 'POST',
                            headers: { 'Authorization': 'Bearer ' + token },
                            body: formData
                        });
                        if (!uploadRes.ok) {
                            console.error('Slika upload failed:', uploadRes.status);
                        }
                    } catch (e) {
                        console.error('Slika upload error:', e);
                    }
                }

                window.location.href = 'index.html';
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Registriraj se';
            }
        });
    </script>
</body>
</html>

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Posluzi statiku. Ako datoteka ne postoji, vrati 404 (nije SPA).
    location / {
        try_files $uri $uri/ =404;
    }

    # Iskljuci cache tijekom demonstracije da uvijek vidis najnoviju verziju.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # --- OPCIONALNO ---
    # Frontend trenutno zove backend direktno na http://localhost:8080.
    # To radi jer je backend port mapiran na host. Ako jednom budes htio
    # da frontend zove backend preko nginxa (npr. za pravi deploy), mozes
    # otkomentirati ovaj proxy i promijeniti fetch pozive na /api/...:
    #
    # location /api/ {
    #     proxy_pass http://backend:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}

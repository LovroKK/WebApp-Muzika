<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moji Poslovi - BeatSync Connect</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/config.js"></script>
    <script src="components/navbar.js"></script>
</head>
<body class="bg-gray-900 text-gray-100">
    <beat-sync-navbar></beat-sync-navbar>

    <main class="container mx-auto px-4 py-8 max-w-5xl">
        <div class="mb-8">
            <a href="javascript:history.back()" class="text-purple-400 hover:text-purple-300 flex items-center gap-1 text-sm mb-3">
                <i data-feather="arrow-left" class="w-4 h-4"></i> Nazad
            </a>
            <h1 class="text-4xl font-bold" id="pageTitle">Moji Poslovi</h1>
            <p class="text-gray-400 mt-2" id="pageSubtitle"></p>
        </div>

        <div id="loginMsg" class="hidden text-center py-16 text-gray-400">
            <p class="text-lg mb-4">Prijavite se za pregled završenih poslova.</p>
            <a href="auth.html" class="bg-purple-600 hover:bg-purple-700 px-6 py-3 rounded-lg font-medium">Prijava</a>
        </div>

        <!-- Statistike -->
        <div id="stats" class="hidden grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 text-center">
                <div id="statBroj" class="text-3xl font-bold text-purple-400">0</div>
                <div class="text-sm text-gray-400 mt-1">Završenih poslova</div>
            </div>
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 text-center">
                <div id="statZarada" class="text-3xl font-bold text-green-400">0 €</div>
                <div class="text-sm text-gray-400 mt-1" id="statZaradaLabel">Ukupna zarada</div>
            </div>
            <div class="bg-gray-800 rounded-lg p-4 border border-gray-700 text-center hidden md:block">
                <div id="statZadnji" class="text-3xl font-bold text-blue-400">—</div>
                <div class="text-sm text-gray-400 mt-1">Zadnji posao</div>
            </div>
        </div>

        <div id="lista" class="space-y-4"></div>

        <div id="emptyState" class="hidden text-center py-16">
            <i data-feather="briefcase" class="w-16 h-16 mx-auto mb-4 text-gray-600"></i>
            <h3 class="text-xl font-semibold mb-2">Nema završenih poslova</h3>
            <p class="text-gray-400" id="emptyMsg">Završeni poslovi će se prikazati ovdje.</p>
        </div>
    </main>

    <script>
        feather.replace();

        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (!token) {
            document.getElementById('loginMsg').classList.remove('hidden');
        } else {
            if (role === 'BUSINESS') {
                document.getElementById('pageSubtitle').textContent = 'Pregled svih završenih angažmana koje ste organizirali.';
                document.getElementById('statZaradaLabel').textContent = 'Ukupno isplaćeno';
                document.getElementById('emptyMsg').textContent = 'Kada završite angažman s izvođačem, prikazat će se ovdje.';
            } else {
                document.getElementById('pageSubtitle').textContent = 'Pregled aktivnih i završenih angažmana.';
                document.getElementById('emptyMsg').textContent = 'Kada vam klub prihvati prijavu, angažman će se prikazati ovdje.';
            }
            ucitaj();
        }

        const AKTIVNI_STATUSI = ['ACCEPTED', 'IN_PROGRESS'];

        async function ucitaj() {
            try {
                const res = await fetch(`${API_BASE_URL}/rezervacije`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error();
                const sve = await res.json();

                // BUSINESS vidi samo COMPLETED; IZVODAC vidi ACCEPTED, IN_PROGRESS i COMPLETED
                const prikazani = role === 'BUSINESS'
                    ? sve.filter(r => r.statusRezervacije === 'COMPLETED')
                    : sve.filter(r => r.statusRezervacije === 'COMPLETED' || AKTIVNI_STATUSI.includes(r.statusRezervacije));

                if (prikazani.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }

                // Statistike računamo samo na COMPLETED
                const completed = prikazani.filter(r => r.statusRezervacije === 'COMPLETED');
                prikaziStatistike(completed);

                // Sortiraj: aktivni (ACCEPTED/IN_PROGRESS) prvi, zatim COMPLETED po datumu desc
                const sortirani = [
                    ...prikazani.filter(r => AKTIVNI_STATUSI.includes(r.statusRezervacije))
                                .sort((a, b) => new Date(a.datumPonude) - new Date(b.datumPonude)),
                    ...prikazani.filter(r => r.statusRezervacije === 'COMPLETED')
                                .sort((a, b) => new Date(b.datumPonude) - new Date(a.datumPonude))
                ];

                document.getElementById('lista').innerHTML = sortirani.map(r => renderKartica(r)).join('');
                feather.replace();
            } catch {
                document.getElementById('lista').innerHTML =
                    '<p class="text-center text-red-400">Greška pri učitavanju poslova.</p>';
            }
        }

        function prikaziStatistike(lista) {
            const stats = document.getElementById('stats');
            stats.classList.remove('hidden');

            document.getElementById('statBroj').textContent = lista.length;

            const ukupno = lista.reduce((sum, r) => sum + (parseFloat(r.budzet) || 0), 0);
            document.getElementById('statZarada').textContent = ukupno.toLocaleString('hr-HR') + ' €';

            const najnoviji = lista.reduce((latest, r) => {
                if (!r.datumPonude) return latest;
                return !latest || new Date(r.datumPonude) > new Date(latest) ? r.datumPonude : latest;
            }, null);
            if (najnoviji) {
                document.getElementById('statZadnji').textContent =
                    new Date(najnoviji).toLocaleDateString('hr-HR');
            }
        }

        const statusConfig = {
            ACCEPTED:    { label: 'Prihvaćeno',  cls: 'bg-green-700/60 text-green-300',   icon: 'check-circle' },
            IN_PROGRESS: { label: 'U tijeku',    cls: 'bg-blue-700/60 text-blue-300',     icon: 'play-circle'  },
            COMPLETED:   { label: 'Završeno',    cls: 'bg-gray-600/60 text-gray-300',     icon: 'check-circle' },
        };

        function renderKartica(r) {
            const datum = r.datumPonude ? new Date(r.datumPonude).toLocaleDateString('hr-HR') : '—';
            const od = r.periodOd ? r.periodOd.substring(11, 16) : '—';
            const do_ = r.periodDo ? r.periodDo.substring(11, 16) : '—';
            const budzet = r.budzet ? parseFloat(r.budzet).toLocaleString('hr-HR') + ' €' : '—';

            const drugiKorisnik = role === 'BUSINESS'
                ? `<span class="font-medium text-gray-200">${r.izvodacIme} ${r.izvodacPrezime}</span>
                   <span class="text-gray-500 text-xs ml-1">@${r.izvodacUsername}</span>`
                : `<span class="font-medium text-gray-200">${r.nazivKluba}</span>
                   <span class="text-gray-500 text-xs ml-1">@${r.businessUsername}</span>`;

            const labelDrugi = role === 'BUSINESS' ? 'Izvođač' : 'Klub';
            const s = statusConfig[r.statusRezervacije] || statusConfig.COMPLETED;

            // Poseban border za aktivne statuse da se vizualno ističu
            const borderCls = AKTIVNI_STATUSI.includes(r.statusRezervacije)
                ? 'border-purple-700/50 hover:border-purple-600'
                : 'border-gray-700 hover:border-gray-600';

            return `
                <div class="bg-gray-800 rounded-lg p-6 border ${borderCls} transition-colors">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="space-y-2">
                            <div class="flex items-center gap-3">
                                <h3 class="text-lg font-semibold">${r.nazivPonude || '—'}</h3>
                                <span class="text-xs px-2 py-1 rounded ${s.cls}">
                                    <i data-feather="${s.icon}" class="w-3 h-3 inline mr-1"></i>${s.label}
                                </span>
                            </div>
                            <p class="text-sm text-gray-400">
                                ${labelDrugi}: ${drugiKorisnik}
                            </p>
                            <div class="flex flex-wrap gap-4 text-sm text-gray-400">
                                <span><i data-feather="calendar" class="w-3 h-3 inline mr-1"></i>${datum}</span>
                                <span><i data-feather="clock" class="w-3 h-3 inline mr-1"></i>${od} – ${do_}</span>
                                <span class="text-purple-400 font-semibold">${budzet}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
        }
    </script>
</body>
</html>

#Define
spring.application.name=beatsync-backend

# MySQL Connection
# Vrijednosti se mogu nadjacati environment varijablama (npr. u Dockeru).
# Ako env varijabla ne postoji, koristi se default iza ":" (lokalni razvoj).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/webapp_muzika?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Multipart file upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# JWT
app.jwt.secret=${APP_JWT_SECRET:nekiDugacakTajniKljucMin32Karaktera123!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:28800000}

# Admin credentials
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:$2a$12$vQHf2/dBwg6U7UX.W79W6eH8HaZ/1dBjvR3VnHXrrPqp5E24H7cd.}

# Server
server.port=8080

# Stripe (TEST mode)
# API kljuc sa https://dashboard.stripe.com/test/apikeys
# Webhook secret iz stripe CLI output-a:
# stripe listen --forward-to localhost:8080/api/placanja/webhook
# Tajne se citaju iz environment varijabli (vidi .env / docker-compose.yml).
# Za lokalni razvoj bez env varijabli, postavi ih u svom okruzenju.
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:8081/payment-success.html}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:8081/payment-cancel.html}

# Logging
logging.level.hr.beatsync=DEBUG
#Define
spring.application.name=beatsync-backend

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/webapp_muzika?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Logging
logging.level.hr.beatsync=DEBUG